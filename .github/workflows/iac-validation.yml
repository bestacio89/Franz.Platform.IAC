name: Infrastructure validation

on:
  pull_request:
    branches: [main]
    paths:
      - "Infrastructure/**"
      - ".github/workflows/**"
      - ".gitlab/ci/**"
      - "pipelines/**"
      - "docs/**"
      - "README.md"
      - "README.fr.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iac-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform validation (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: aws
            working-directory: Infrastructure/Terraform-AWS
          - provider: gcp
            working-directory: Infrastructure/Terraform-GCP
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote state
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

  bicep:
    name: Bicep validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Azure CLI
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: az bicep install

      - name: Build Bicep entry point
        run: az bicep build --file Infrastructure/AzureDevOps-Bicep/main.bicep --stdout > /dev/null
