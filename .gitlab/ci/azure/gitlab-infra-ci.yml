# ========================================
# 🚀 GitLab CI/CD - Manual Infra Deployment (Azure Bicep)
# ========================================
# Generic pipeline to deploy Franz infrastructure to Azure using Bicep.
# Automatically decides whether to include AKS based on the environment.
# ========================================

stages:
  - deploy

infra-deploy:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:2.60.0
  rules:
    - when: manual
  variables:
    # -----------------------------
    # Parameters (override in GitLab UI or group variables)
    # -----------------------------
    DATABASE_TYPE: "single"          # [single, multi]
    EVENT_STORAGE_TYPE: "Kafka"      # [Kafka, CosmosDB, MongoDB]
    ENTITY_STORAGE_TYPE: "SQLServer" # [PostgreSQL, MariaDB, MySQL, SQLServer, Oracle]
    MESSAGING_TYPE: "Kafka"          # [Kafka, RabbitMQ, Both, None]
    ENVIRONMENT: "dev"               # [dev, staging, prod]
    CONTAINER_IMAGE: ""              # optional - injected from build pipeline
    RESOURCE_GROUP: "$AZURE_RESOURCE_GROUP"
    AZURE_SUBSCRIPTION: "$AZURE_SUBSCRIPTION_ID"
    KEYVAULT_NAME: "$AZURE_KEY_VAULT_NAME"

  script:
    # 🔑 Login to Azure
    - echo "🔑 Logging in to Azure..."
    - az login --service-principal \
        -u "$AZURE_CLIENT_ID" \
        -p "$AZURE_CLIENT_SECRET" \
        --tenant "$AZURE_TENANT_ID" >/dev/null

    - az account set --subscription "$AZURE_SUBSCRIPTION"

    # 🔐 (Optional) Fetch secrets from Key Vault
    - echo "🔐 Fetching DB secrets from Key Vault..."
    - |
      if [ -n "$KEYVAULT_NAME" ]; then
        DB_CONNECTION_STRING=$(az keyvault secret show \
          --name DBConnectionString \
          --vault-name "$KEYVAULT_NAME" \
          --query value -o tsv || echo "")
        ADMIN_USER=$(az keyvault secret show \
          --name DBAdminUser \
          --vault-name "$KEYVAULT_NAME" \
          --query value -o tsv || echo "dbadmin")
        ADMIN_PASSWORD=$(az keyvault secret show \
          --name DBAdminPassword \
          --vault-name "$KEYVAULT_NAME" \
          --query value -o tsv || echo "")
        export DB_CONNECTION_STRING ADMIN_USER ADMIN_PASSWORD
      fi

    # ☸️ Determine Container Orchestrator
    - echo "☸️ Determining orchestrator for environment '$ENVIRONMENT'..."
    - |
      if [ "$ENVIRONMENT" = "prod" ] || [ "$ENVIRONMENT" = "staging" ]; then
        CONTAINER_ORCHESTRATOR="aks"
      else
        CONTAINER_ORCHESTRATOR="none"
      fi
      echo "Container orchestrator: $CONTAINER_ORCHESTRATOR"

    # 🚀 Deploy Infrastructure with Bicep
    - echo "===================================="
    - echo "🌍 Environment:  $ENVIRONMENT"
    - echo "🗄️ DB:           $DATABASE_TYPE"
    - echo "📂 Event:        $EVENT_STORAGE_TYPE"
    - echo "📂 Entity:       $ENTITY_STORAGE_TYPE"
    - echo "📩 Messaging:    $MESSAGING_TYPE"
    - echo "☸️ Orchestrator: $CONTAINER_ORCHESTRATOR"
    - echo "🐳 Image:        $CONTAINER_IMAGE"
    - echo "===================================="

    - |
      az deployment group create \
        --resource-group "$RESOURCE_GROUP" \
        --name franz-main-$ENVIRONMENT \
        --template-file Infrastructure/AzureDevOps-Bicep/main.bicep \
        --mode Incremental \
        --only-show-errors \
        --parameters \
          environment=$ENVIRONMENT \
          databaseType=$DATABASE_TYPE \
          eventStorageType=$EVENT_STORAGE_TYPE \
          entityStorageType=$ENTITY_STORAGE_TYPE \
          messagingType=$MESSAGING_TYPE \
          containerImage=$CONTAINER_IMAGE \
          containerOrchestrator=$CONTAINER_ORCHESTRATOR \
          adminUser="$ADMIN_USER" \
          adminPassword="$ADMIN_PASSWORD" \
          DBConnectionString="$DB_CONNECTION_STRING"

    # 📤 Capture Outputs
    - echo "📤 Capturing deployment outputs..."
    - |
      az deployment group show \
        -g "$RESOURCE_GROUP" \
        -n franz-main-$ENVIRONMENT \
        --query properties.outputs -o json > infra-outputs.json

      echo "🔎 Outputs saved:"
      cat infra-outputs.json

  artifacts:
    name: "infra-outputs-$ENVIRONMENT"
    paths:
      - infra-outputs.json
    expire_in: 7 days
